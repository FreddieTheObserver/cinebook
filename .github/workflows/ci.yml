name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make vet lint sqlc-diff build
      # Integration tests start their own Postgres through the runner's Docker.
      - run: make test

  migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cinebook
          POSTGRES_USER: cinebook
          POSTGRES_PASSWORD: cinebook
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinebook -d cinebook"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      CINEBOOK_DSN: postgres://cinebook:cinebook@localhost:5432/cinebook?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make migrate-cycle
